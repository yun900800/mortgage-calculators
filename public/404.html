<!doctype html>
<html lang="zh-Hans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, follow" />
        <title>页面未找到 (404) - 房贷计算器</title>
        <style>
            :root {
                --primary: #133041;
                --accent: #d8db2f;
                --bg: #e4f4fd;
                --text: #4e6e7e;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-family:
                    'Plus Jakarta Sans',
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: var(--bg);
                color: var(--text);
            }
            .container {
                width: 100%;
                max-width: 560px;
                padding: 48px 40px;
                text-align: center;
                background: #fff;
                border-radius: 24px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            }
            .code {
                margin: 0;
                font-size: 5rem;
                font-weight: 800;
                line-height: 1;
                color: var(--accent);
            }
            h1 {
                margin: 16px 0 8px;
                font-size: 1.8rem;
                color: var(--primary);
            }
            p {
                margin: 0 0 28px;
                line-height: 1.7;
            }
            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
            }
            .actions a {
                display: inline-block;
                padding: 12px 22px;
                border-radius: 10px;
                font-weight: 700;
                text-decoration: none;
                transition: transform 0.2s ease;
            }
            .actions a:hover {
                transform: translateY(-2px);
            }
            .primary {
                background: var(--primary);
                color: #fff;
            }
            .secondary {
                background: var(--accent);
                color: var(--primary);
            }
        </style>
    </head>
    <body>
        <main class="container">
            <p class="code">404</p>
            <h1>页面未找到</h1>
            <p>你访问的页面不存在，可能已经移动或删除。请从下面的入口继续。</p>
            <div class="actions">
                <a class="primary" href="/">返回房贷计算器</a>
                <a class="secondary" href="/blog/">查看房贷指南</a>
            </div>
        </main>
    </body>
</html>
