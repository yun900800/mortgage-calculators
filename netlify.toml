# 全局构建设置
[build]
  # 这里的命令会自动安装依赖并执行打包
  # 使用 npx 可以更好地解决你遇到的 Permission Denied 权限问题
  command = "npm install && npm run build"
  
  # Vite 默认打包后的文件夹是 dist
  publish = "dist"

# 环境配置（确保 Node 版本足够运行 Vite 5+）
[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

# 处理单页应用 (SPA) 刷新 404 的重定向规则
# 这相当于把 _redirects 文件的内容写在了这里
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# (可选) 针对特定资源的缓存优化
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"